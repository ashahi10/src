name: memory-server

on:
  push:
    branches: [main, master]
    paths:
      - 'packages/memory-server/**'
      - 'packages/shared-types/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/memory-server-ci.yml'
  pull_request:
    paths:
      - 'packages/memory-server/**'
      - 'packages/shared-types/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/memory-server-ci.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify memory-server (build, types, tests, smoke, MCP stdio e2e)
        run: pnpm --filter @tengu/memory-server run verify:ship
